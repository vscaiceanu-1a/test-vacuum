name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

      - name: Lint (Push to Main)
        run: npx redocly lint --format=github-actions

      - name: Lint HEAD (PR)
        if: github.event_name == 'pull_request'
        id: lint_head
        continue-on-error: true
        run: npx redocly lint bundle/specification.yaml --format=json > head_lint.json

      - name: Checkout Base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base_checkout

      - name: Install Dependencies (Base)
        if: github.event_name == 'pull_request'
        run: |
          cd base_checkout
          npm ci
          npm run build

      - name: Lint Base (PR)
        if: github.event_name == 'pull_request'
        id: lint_base
        continue-on-error: true
        run: |
          cd base_checkout
          npx redocly lint bundle/specification.yaml --format=json > ../base_lint.json

      - name: Compare Lint Results
        if: github.event_name == 'pull_request'
        id: compare_lint
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Run the comparison script and capture output
            try {
              const output = execSync('node scripts/compare-lint.js head_lint.json base_lint.json').toString();
              console.log(output);
              
              // If there are new violations (indicated by the header in output), post a comment
              if (output.includes("### 🚨 New Lint Violations Detected")) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: output
                });
                core.setFailed("New lint violations detected.");
              }
            } catch (error) {
              console.error("Error comparing lint results:", error);
              core.setFailed("Failed to compare lint results.");
            }