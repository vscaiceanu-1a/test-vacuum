extends: [spectral:oas]

rules:
  # The end goal is to have a custom function that allows 'description' and 'summary' siblings for $ref in order to be forward compatible with OAS 3.1
  # This warning is to be removed when the custom function is implemented
  no-$ref-siblings: warn
  
  # TODO: fix errors on core api and then remove the ignore
  oas3-valid-schema-example: warn
  
  # Custom rule to prevent properties field next to allOf, oneOf, anyOf, or not
  no-properties-with-schema-composition:
    description: Properties should not be defined at the same level as allOf, oneOf, anyOf, or not.
    documentationUrl: https://github.com/amadeus-airlines-solutions/spectral-rulesets/blob/main/docs/rules/no-properties-with-schema-composition.md
    message: "Schema '{{path}}' has both a schema composition keyword (allOf/oneOf/anyOf/not) and 'properties' at the same level. Move 'properties' inside the composition array for proper schema structure. See https://github.com/AmadeusITGroup/otter/issues/2832 for details."
    severity: error
    given: $..[?((@.allOf || @.oneOf || @.anyOf || @.not) && @.properties)]
    then:
      function: falsy
      field: properties
