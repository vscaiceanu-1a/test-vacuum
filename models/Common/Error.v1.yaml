title: Error
type: object
description: |-
  Represents an error in the API response.
  Provides details about what went wrong and how to fix it.
properties:
  code:
    type: string
    description: Machine-readable error code
    example: "INVALID_REQUEST"
  title:
    type: string
    description: Short error title
    example: "Invalid Request"
  detail:
    type: string
    description: Detailed error message explaining what went wrong
    example: "The request body is missing required field 'email'"
  status:
    type: integer
    description: HTTP status code
    example: 400
  source:
    type: object
    description: Source of the error
    properties:
      pointer:
        type: string
        description: JSON pointer to the field causing the error
        example: "/data/attributes/email"
      parameter:
        type: string
        description: Query parameter that caused the error
        example: "limit"
required:
  - code
  - title
  - status
